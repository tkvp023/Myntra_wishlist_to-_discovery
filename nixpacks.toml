[variables]
DATABASE_URL = "file:./dev.db"

[phases.setup]
nixPkgs = ["nodejs_20", "openssl"]

[phases.install]
cmds = ["cd backend && npm install"]

[phases.build]
cmds = ["export DATABASE_URL=\"${DATABASE_URL:-file:./dev.db}\" && cd backend && npx prisma generate"]

[start]
cmd = "export DATABASE_URL=\"${DATABASE_URL:-file:./dev.db}\" && cd backend && npx prisma generate && npx prisma db push && node prisma/seed.js && node src/index.js"

