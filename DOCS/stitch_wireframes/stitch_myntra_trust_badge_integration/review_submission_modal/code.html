<!-- Interactive script for wireframe feel -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Simple interaction for stars
            const stars = document.querySelectorAll('.group .material-symbols-outlined');
            stars.forEach((star, index) => {
                star.addEventListener('click', () => {
                    // Reset all
                    stars.forEach(s => {
                        s.classList.remove('fill', 'text-neutral-amber');
                        s.classList.add('text-outline-variant');
                    });
                    // Fill up to clicked
                    for(let i = 0; i <= index; i++) {
                        stars[i].classList.add('fill', 'text-neutral-amber');
                        stars[i].classList.remove('text-outline-variant');
                    }
                    // Update text
                    const label = star.parentElement.nextElementSibling;
                    const ratings = ["Terrible", "Poor", "Average", "Good", "Excellent"];
                    label.textContent = ratings[index];
                    label.classList.add('text-primary');
                });
            });
        });
    </script>
